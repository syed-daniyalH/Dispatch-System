<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Make.com main scenario used in Dispatch</title>
  <desc id="desc">A visual summary of the Dispatch Make.com workflow showing Twilio intake, data enrichment, validation, translation, routing, and ignore paths.</desc>

  <defs>
    <linearGradient id="sidebarGradient" x1="0" y1="0" x2="0" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D946EF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1E293B" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1280" height="560" fill="#F6F7FB"/>
  <rect width="96" height="560" fill="url(#sidebarGradient)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="48" y="38" font-size="28" font-weight="800" fill="#FFFFFF">M</text>
    <text x="48" y="92" font-size="11" font-weight="700" fill="#FFFFFF">Org</text>
    <text x="48" y="154" font-size="11" font-weight="700" fill="#FFFFFF" opacity="0.75">Scenarios</text>
    <text x="48" y="214" font-size="11" font-weight="700" fill="#FFFFFF" opacity="0.75">AI Agents</text>
    <text x="48" y="274" font-size="11" font-weight="700" fill="#FFFFFF" opacity="0.75">Credentials</text>
    <text x="48" y="334" font-size="11" font-weight="700" fill="#FFFFFF" opacity="0.75">Webhooks</text>
    <text x="48" y="394" font-size="11" font-weight="700" fill="#FFFFFF" opacity="0.75">Toolboxes</text>
    <text x="48" y="454" font-size="11" font-weight="700" fill="#FFFFFF" opacity="0.75">Templates</text>
    <text x="48" y="514" font-size="11" font-weight="700" fill="#FFFFFF" opacity="0.75">More</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="116" y="18" width="250" height="42" rx="13" fill="#FFFFFF"/>
    <circle cx="140" cy="39" r="11" fill="#F1F5F9"/>
    <text x="140" y="43" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">Back</text>
    <text x="176" y="44" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A">Alex DISPATCH</text>
    <circle cx="342" cy="39" r="11" fill="#F1F5F9"/>
    <text x="342" y="43" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">Menu</text>

    <rect x="1110" y="18" width="146" height="42" rx="13" fill="#FFFFFF"/>
    <text x="1183" y="44" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#94A3B8" text-anchor="middle">Share</text>
    <rect x="1216" y="18" width="40" height="42" rx="13" fill="#FFFFFF"/>
    <text x="1236" y="44" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">...</text>
  </g>

  <line x1="145" y1="332" x2="1238" y2="332" stroke="#D6DAE8" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(150 332)">
      <circle r="26" fill="#EF4444" filter="url(#softShadow)"/>
      <text y="5" font-size="12" font-weight="800" fill="#FFFFFF">TW</text>
      <text y="48" font-size="12" font-weight="700" fill="#334155">Twilio</text>
    </g>

    <g transform="translate(246 332)">
      <circle r="26" fill="#0EA5E9" filter="url(#softShadow)"/>
      <text y="5" font-size="12" font-weight="800" fill="#FFFFFF">H</text>
      <text y="48" font-size="12" font-weight="700" fill="#334155">Auth Token</text>
    </g>

    <g transform="translate(342 332)">
      <circle r="26" fill="#0EA5E9" filter="url(#softShadow)"/>
      <text y="5" font-size="12" font-weight="800" fill="#FFFFFF">H</text>
      <text y="48" font-size="12" font-weight="700" fill="#334155">GET Services</text>
    </g>

    <g transform="translate(438 332)">
      <circle r="26" fill="#0EA5E9" filter="url(#softShadow)"/>
      <text y="5" font-size="12" font-weight="800" fill="#FFFFFF">H</text>
      <text y="48" font-size="12" font-weight="700" fill="#334155">GET Dealers</text>
    </g>

    <g transform="translate(534 332)">
      <circle r="26" fill="#A3E635" filter="url(#softShadow)"/>
      <text y="5" font-size="12" font-weight="800" fill="#365314">A</text>
      <text y="48" font-size="12" font-weight="700" fill="#334155">Array Agg</text>
    </g>

    <g transform="translate(630 332)">
      <circle r="26" fill="#10B981" filter="url(#softShadow)"/>
      <text y="5" font-size="12" font-weight="800" fill="#FFFFFF">S</text>
      <text y="48" font-size="12" font-weight="700" fill="#334155">Services Check</text>
    </g>

    <g transform="translate(726 332)">
      <circle r="26" fill="#10B981" filter="url(#softShadow)"/>
      <text y="5" font-size="12" font-weight="800" fill="#FFFFFF">D</text>
      <text y="48" font-size="12" font-weight="700" fill="#334155">Dealer Check</text>
    </g>

    <g transform="translate(822 332)">
      <circle r="26" fill="#14B8A6" filter="url(#softShadow)"/>
      <text y="5" font-size="12" font-weight="800" fill="#FFFFFF">B</text>
      <text y="48" font-size="12" font-weight="700" fill="#334155">The Brain</text>
    </g>

    <g transform="translate(918 332)">
      <circle r="26" fill="#A78BFA" filter="url(#softShadow)"/>
      <text y="5" font-size="12" font-weight="800" fill="#FFFFFF">T</text>
      <text y="48" font-size="12" font-weight="700" fill="#334155">Translator</text>
    </g>

    <g transform="translate(1014 332)">
      <circle r="26" fill="#84CC16" filter="url(#softShadow)"/>
      <text y="5" font-size="12" font-weight="800" fill="#FFFFFF">R</text>
      <text y="48" font-size="12" font-weight="700" fill="#334155">Router</text>
    </g>

    <g transform="translate(1110 332)">
      <circle r="26" fill="#0EA5E9" filter="url(#softShadow)"/>
      <text y="5" font-size="12" font-weight="800" fill="#FFFFFF">H</text>
      <text y="48" font-size="12" font-weight="700" fill="#334155">HTTP</text>
    </g>

    <g transform="translate(1206 332)">
      <circle r="26" fill="#D9F99D" filter="url(#softShadow)"/>
      <text y="5" font-size="12" font-weight="800" fill="#365314">I</text>
      <text y="48" font-size="12" font-weight="700" fill="#334155">Ignore</text>
    </g>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="120" y="512" font-size="13" font-weight="700" fill="#475569">Dispatch automation flow</text>
    <text x="120" y="534" font-size="12" fill="#64748B">Twilio SMS -> data enrichment -> AI parsing -> routing -> backend handoff</text>
  </g>
</svg>
